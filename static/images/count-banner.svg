<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#2a2a45"/>
    </linearGradient>
    <linearGradient id="counter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg2)"/>

  <!-- odometer-style counter box -->
  <rect x="230" y="140" width="340" height="110" rx="14" fill="url(#counter)"/>
  <rect x="230" y="140" width="340" height="110" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="315" y1="150" x2="315" y2="240" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="400" y1="150" x2="400" y2="240" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="485" y1="150" x2="485" y2="240" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <text x="272" y="215" font-family="Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
  <text x="357" y="215" font-family="Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
  <text x="442" y="215" font-family="Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
  <text x="527" y="215" font-family="Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <!-- text -->
  <text x="400" y="100" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">Suleiman's Containers Challenge</text>
  <text x="400" y="290" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#94a3b8" text-anchor="middle">Visit Counter</text>

  <!-- redis accent -->
  <circle cx="345" cy="330" r="6" fill="#f87171"/>
  <text x="358" y="336" font-family="Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">powered by Redis</text>
</svg>
