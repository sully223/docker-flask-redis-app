<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#2a2a45"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- stacked shipping containers -->
  <g>
    <rect x="60" y="160" width="120" height="80" rx="8" fill="url(#box1)"/>
    <rect x="60" y="160" width="120" height="80" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    <line x1="60" y1="182" x2="180" y2="182" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <line x1="60" y1="204" x2="180" y2="204" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <line x1="60" y1="222" x2="180" y2="222" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

    <rect x="195" y="135" width="120" height="80" rx="8" fill="url(#box2)"/>
    <rect x="195" y="135" width="120" height="80" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    <line x1="195" y1="157" x2="315" y2="157" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <line x1="195" y1="179" x2="315" y2="179" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <line x1="195" y1="197" x2="315" y2="197" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

    <rect x="130" y="245" width="120" height="80" rx="8" fill="url(#box3)"/>
    <rect x="130" y="245" width="120" height="80" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    <line x1="130" y1="267" x2="250" y2="267" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <line x1="130" y1="289" x2="250" y2="289" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <line x1="130" y1="307" x2="250" y2="307" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  </g>

  <!-- text -->
  <text x="400" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Welcome to</text>
  <text x="400" y="200" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Suleiman's</text>
  <text x="400" y="246" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Containers Challenge</text>

  <!-- small flask + redis + docker accents -->
  <circle cx="405" cy="285" r="6" fill="#34d399"/>
  <text x="418" y="291" font-family="Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">Flask</text>
  <circle cx="490" cy="285" r="6" fill="#f87171"/>
  <text x="503" y="291" font-family="Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">Redis</text>
  <circle cx="580" cy="285" r="6" fill="#38bdf8"/>
  <text x="593" y="291" font-family="Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">Docker</text>
</svg>
